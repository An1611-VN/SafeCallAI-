name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Accept Android licenses
        run: |
          sudo mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' | sudo tee "$ANDROID_HOME/licenses/android-sdk-license" > /dev/null || true
      - name: Build
        run: |
          shopt -s nullglob
          mkdir -p project
          NEWEST=$(for z in *.zip; do echo "$(git log -1 --format=%ct -- "$z") $z"; done | sort -rn | head -1 | cut -d' ' -f2-)
          echo "Dung file: $NEWEST"
          if [ -n "$NEWEST" ]; then unzip -o -q "$NEWEST" -d project; fi
          for i in 1 2 3; do
            find project -name '*.zip' -print0 | while IFS= read -r -d '' z; do
              unzip -o -q "$z" -d "${z%.zip}_x" || true
            done
          done
          find project -maxdepth 6 | head -40
          SET=$(find project -name settings.gradle | head -1)
          if [ -z "$SET" ]; then SET=$(find . -name settings.gradle -not -path './.git/*' | head -1); fi
          if [ -z "$SET" ]; then echo "KHONG TIM THAY DU AN GRADLE"; exit 1; fi
          cd "$(dirname "$SET")"
          gradle assembleDebug --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/SafeCallAI.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SafeCallAI-apk
          path: out/SafeCallAI.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SafeCall AI (APK mới nhất)
          files: out/SafeCallAI.apk
