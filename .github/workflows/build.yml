name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
   #   - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -o -q "$z" -d project; done
          DIR=$(dirname "$(find . -maxdepth 4 -name settings.gradle -not -path './.git/*' | head -1)")
          cd "$DIR"
          gradle assembleDebug --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/SafeCallAI.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SafeCallAI-apk
          path: out/SafeCallAI.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SafeCall AI (APK mới nhất)
          files: out/SafeCallAI.apk
